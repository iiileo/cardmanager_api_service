server:
  address: ":8080"
  mode: local

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres
  dbname: card_manager
  sslmode: disable

logging:
  level: info

access_log:
  enabled: true
  file_path: "data/access.jsonl"
  max_memory: 300
  max_body_bytes: 8192
  ui_enabled: true
  ui_path: "/debug/access-logs"
  skip_paths:
    - "/healthz"
    - "/debug/access-logs"
    - "/debug/access-logs/api"

auth:
  jwt_secret: "card-manager-dev-secret-change-me"
  access_ttl_seconds: 7200
  refresh_ttl_seconds: 2592000
  sms_code_ttl_seconds: 300
  sms_dev_code: "123456"
  sms_dev_mode: true
